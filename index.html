        :root {
            --cyan: #22d3ee;
            --purple: #a855f7;
            --bg-dark: #020617;
        }

        body, html {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: #f1f5f9;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .content-overlay {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, var(--cyan), var(--purple));
            border-radius: 10px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .floating-ui {
            animation: float 4s ease-in-out infinite;
        }

        .gradient-text {
            background: linear-gradient(to right, var(--cyan), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .portfolio-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .portfolio-card:hover {
            transform: translateY(-5px);
            border-color: rgba(34, 211, 238, 0.4);
            box-shadow: 0 10px 30px -10px rgba(34, 211, 238, 0.2);
        }

        .fade-img {
            transition: opacity 0.8s ease-in-out;
        }
    </style>
</head>

    <script>
        let scene, camera, renderer, particles, nodes = [];
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;
        let aboutInterval;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            const ambient = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambient);
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(2000 * 3);
            for(let i=0; i<6000; i++) pos[i] = (Math.random() - 0.5) * 20;
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            particles = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x22d3ee, size: 0.02, transparent: true, opacity: 0.5 }));
            scene.add(particles);
            createNode(0x22d3ee, {x: -3, y: 1.5, z: 0}, 'sobre');
            createNode(0x4ade80, {x: 3, y: 2, z: -1}, 'webdev');
            createNode(0xa855f7, {x: 3.5, y: -2, z: 1}, 'design');
            createNode(0xfbbf24, {x: -3, y: -1.5, z: -1}, 'foto');
            createNode(0xff00ff, {x: 0, y: -3, z: 1}, 'musica');
            window.addEventListener('resize', onResize);
            document.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX - window.innerWidth/2)/150;
                mouseY = (e.clientY - window.innerHeight/2)/150;
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });
            document.addEventListener('mousedown', onNodeClick);
            animate();
        }

        function createNode(color, pos, id) {
            const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5, 1), new THREE.MeshPhongMaterial({ color, wireframe: true, transparent: true, opacity: 0.6 }));
            mesh.position.set(pos.x, pos.y, pos.z);
            mesh.userData = { id };
            scene.add(mesh);
            nodes.push(mesh);
        }

        function onNodeClick() {
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(nodes);
            if(hits.length > 0) {
                const id = hits[0].object.userData.id;
                showSection(id === 'foto' || id === 'design' || id === 'musica' || id === 'webdev' ? 'portfolio' : id, id);
            }
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            targetRotationX += (mouseY * 0.08 - targetRotationX) * 0.05;
            targetRotationY += (mouseX * 0.08 - targetRotationY) * 0.05;
            particles.rotation.y += 0.0005;
            nodes.forEach(n => { n.rotation.y += 0.01; n.rotation.z += 0.005; });
            scene.rotation.x = targetRotationX;
            scene.rotation.y = targetRotationY;
            renderer.render(scene, camera);
        }

        function showSection(id, sub = 'musica') {
            const overlay = document.getElementById('overlay-content');
            const dynamic = document.getElementById('dynamic-content');
            const hero = document.getElementById('hero-section');
            dynamic.innerHTML = typeof contents[id] === 'function' ? contents[id](sub) : contents[id];
            overlay.classList.remove('hidden');
            setTimeout(() => overlay.classList.add('opacity-100'), 10);
            hero.style.opacity = '0';
            document.body.style.overflow = 'hidden';
            if(id === 'sobre') startAboutRotation();
        }

        function closeSection() {
            const overlay = document.getElementById('overlay-content');
            const hero = document.getElementById('hero-section');
            if(overlay.classList.contains('hidden')) return;
            overlay.classList.remove('opacity-100');
            setTimeout(() => {
                overlay.classList.add('hidden');
                hero.style.opacity = '1';
                document.body.style.overflow = 'auto';
                if (aboutInterval) clearInterval(aboutInterval);
            }, 500);
        }

        function toggleMobileMenu() {
            const m = document.getElementById('mobile-menu');
            m.classList.toggle('hidden');
            m.classList.toggle('flex');
        }

        function startAboutRotation() {
            if (aboutInterval) clearInterval(aboutInterval);
            let idx = 0;
            const photos = [
                "https://github.com/Goguenblouts/SiteMarcelio/blob/main/Sobre/representativa.png?raw=true",
                "https://github.com/Goguenblouts/SiteMarcelio/blob/main/Sobre/img2.png?raw=true",
                "https://github.com/Goguenblouts/SiteMarcelio/blob/main/Sobre/img3.png?raw=true",
                "https://github.com/Goguenblouts/SiteMarcelio/blob/main/Sobre/img4.png?raw=true",
                "https://github.com/Goguenblouts/SiteMarcelio/blob/main/Sobre/img5.png?raw=true",
                "https://github.com/Goguenblouts/SiteMarcelio/blob/main/Sobre/img6.png?raw=true",
                "https://github.com/Goguenblouts/SiteMarcelio/blob/main/Sobre/img7.png?raw=true",
                "https://github.com/Goguenblouts/SiteMarcelio/blob/main/Sobre/img8.png?raw=true",
                "https://github.com/Goguenblouts/SiteMarcelio/blob/main/Sobre/img9.png?raw=true",
                "https://github.com/Goguenblouts/SiteMarcelio/blob/main/Sobre/img10.png?raw=true"
            ];
            aboutInterval = setInterval(() => {
                const img = document.getElementById('rotating-photo');
                if(!img) return;
                img.style.opacity = '0';
                setTimeout(() => {
                    idx = (idx + 1) % photos.length;
                    img.src = photos[idx];
                    img.style.opacity = '1';
                }, 800);
            }, 3000);
        }

        window.onload = initThree;
    </script>
</body>
</html>
